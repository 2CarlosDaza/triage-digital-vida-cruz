spring.config.import=optional:file:.env[.properties]

spring.r2dbc.url=${TRIAJE_DB_R2DBC_URL:r2dbc:postgresql://localhost:5432/vida_cruz}
spring.r2dbc.username=${TRIAJE_DB_USUARIO:vida_cruz_runtime}
spring.r2dbc.password=${TRIAJE_DB_PASSWORD:}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=${TRIAJE_DB_POOL_MAXIMO:10}
spring.r2dbc.pool.max-idle-time=30m
spring.r2dbc.pool.max-acquire-time=5s
spring.r2dbc.pool.max-create-connection-time=5s

spring.flyway.url=${TRIAJE_DB_FLYWAY_URL:jdbc:postgresql://localhost:5432/vida_cruz}
spring.flyway.user=${TRIAJE_DB_FLYWAY_USUARIO:vida_cruz_migracion}
spring.flyway.password=${TRIAJE_DB_FLYWAY_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.placeholders.usuario-runtime=${TRIAJE_DB_USUARIO:vida_cruz_runtime}
